<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#ffffff;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Browse & Search Playbook</title>
<style>
  :root{
    --paper:#FFFFFF;
    --paper-raised:#F4F4F6;
    --ink:#17151C;
    --ink-soft:#4A4650;
    --slate:#6E6A78;
    --pink:#F71963;
    --pink-dim:#FDE4EC;
    --pink-ink:#F71963;
    --native:#1E9E5A;
    --native-dim:#E3F5EA;
    --custom:#B98900;
    --custom-dim:#FBF1D2;
    --line:#E7E2E8;
    --line-strong:#D7D0DA;
    --focus:#2C6BE8;
    --shadow: 0 1px 2px rgba(23,21,28,.04), 0 8px 24px rgba(23,21,28,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#15131B; --paper-raised:#1D1A24; --ink:#F3F0F5; --ink-soft:#C7C1D0; --slate:#A29CB0;
      --pink:#FF3D7F; --pink-dim:#3A1526; --pink-ink:#FF6C9C;
      --native:#4ADE80; --native-dim:#173322;
      --custom:#F2C94C; --custom-dim:#3A2E0E;
      --line:#2A2733; --line-strong:#38333F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#15131B; --paper-raised:#1D1A24; --ink:#F3F0F5; --ink-soft:#C7C1D0; --slate:#A29CB0;
    --pink:#FF3D7F; --pink-dim:#3A1526; --pink-ink:#FF6C9C;
    --native:#4ADE80; --native-dim:#173322;
    --custom:#F2C94C; --custom-dim:#3A2E0E;
    --line:#2A2733; --line-strong:#38333F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{text-wrap:balance; margin:0;}
  .mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;}
  a{color:var(--pink-ink); text-decoration:none;}
  a:hover{text-decoration:underline;}
  :focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px;}
  button{font:inherit;}

  /* ---------- Sticky header (top bar + requirement menu, as one block) ---------- */
  .sticky-head{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--paper);}
  .topbar{background:var(--paper);}
  .topbar-inner{max-width:1180px; margin:0 auto; padding:18px 20px 14px; display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{height:30px; padding:0 10px; border-radius:8px; background:var(--pink); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px; letter-spacing:.03em; flex:none;}
  .brand-text .eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--slate); display:block;}
  .brand-text h1{font-size:19px; font-weight:600;}
  /* ---------- Scorecard ---------- */
  .scoreband{background:var(--paper);}
  .scoreband-inner{max-width:1180px; margin:0 auto; padding:8px 20px 22px; display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
  @media (max-width:760px){ .scoreband-inner{grid-template-columns:repeat(2,1fr); gap:18px;} }
  .stat .figure{font-size:46px; font-weight:700; line-height:1.05; letter-spacing:-.02em; color:var(--ink);}
  .stat .label{font-size:14px; font-weight:600; margin-top:10px; color:var(--ink);}
  .stat .sub{font-size:12px; color:var(--slate); margin-top:8px; line-height:1.5;}
  .stat.is-native .figure{color:var(--native);}
  .stat.is-custom .figure{color:var(--custom);}
  .stat.is-none .figure{color:var(--slate);}

  /* ---------- Level 1: requirement menu ---------- */
  .l1-wrap{background:var(--paper); border-bottom:1px solid var(--line);}
  .l1{max-width:1180px; margin:0 auto; padding:10px 20px; display:flex; flex-wrap:wrap; gap:8px;}
  .l1-btn{flex:1 1 140px; display:flex; flex-direction:column; gap:2px; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--paper-raised); cursor:pointer; text-align:left; color:var(--ink-soft); min-width:140px; max-width:190px;}
  .l1-btn .n{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--slate);}
  .l1-btn .t{font-size:12.5px; font-weight:600; line-height:1.25; color:var(--ink);}
  .l1-btn[aria-pressed="true"]{background:var(--pink); border-color:var(--pink);}
  .l1-btn[aria-pressed="true"] .n{color:rgba(255,255,255,.75);}
  .l1-btn[aria-pressed="true"] .t{color:#fff;}
  .l1-btn .flag{font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; margin-top:1px;}
  .l1-btn .flag.native{color:var(--native);}
  .l1-btn .flag.mostly{color:var(--native);}
  .l1-btn .flag.custom{color:var(--custom);}
  .l1-btn[aria-pressed="true"] .flag{color:rgba(255,255,255,.85) !important;}

  /* ---------- Level 2: capability submenu ---------- */
  .l2-wrap{background:var(--paper-raised); border-bottom:1px solid var(--line);}
  .l2-head{max-width:1180px; margin:0 auto; padding:16px 20px 0; display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .l2-head h2{font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate);}
  .l2-head a{font-size:12px; color:var(--pink);}
  .l2{max-width:1180px; margin:0 auto; padding:10px 20px 16px; display:flex; flex-wrap:wrap; gap:8px;}
  .l2-btn{
    display:flex; align-items:center; gap:8px; padding:9px 13px; border-radius:999px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink); cursor:pointer; font-size:13px;
  }
  .l2-btn .dot{width:7px; height:7px; border-radius:50%; flex:none;}
  .l2-btn .dot.native{background:var(--native);}
  .l2-btn .dot.custom{background:var(--custom);}
  .l2-btn .dot.built{background:var(--native);}
  .l2-btn[aria-pressed="true"]{background:var(--pink-dim); border-color:var(--pink); font-weight:600;}

  /* ---------- Content panel ---------- */
  main{max-width:1180px; margin:0 auto; padding:26px 20px 64px;}
  .panel-head{display:flex; flex-wrap:wrap; gap:16px; justify-content:space-between; align-items:flex-start; padding-bottom:18px; border-bottom:1px solid var(--line); margin-bottom:22px;}
  .panel-head .id{font-family:"IBM Plex Mono",monospace; color:var(--slate); font-size:13px;}
  .panel-head h2{font-size:25px; font-weight:650; margin-top:4px; max-width:640px;}
  .badge{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; border:1px solid transparent;}
  .badge.native{background:var(--native-dim); color:var(--native); border-color:var(--native);}
  .badge.custom{background:var(--custom-dim); color:var(--custom); border-color:var(--custom);}
  .badge.built{background:var(--native-dim); color:var(--native); border-color:var(--native);}
  .badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}

  .content-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:28px; align-items:start;}
  @media (max-width:900px){ .content-grid{grid-template-columns:1fr;} }

  .text-col{display:flex; flex-direction:column; gap:20px;}
  .parent-line{font-size:13px; color:var(--slate); line-height:1.5;}
  .parent-line b{color:var(--ink-soft); font-weight:600;}

  .block h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--slate); margin-bottom:10px;}
  .solution p{font-size:15.5px; line-height:1.68; color:var(--ink); margin:0;}

  .doclink{font-size:15px; font-weight:600; color:var(--pink); word-break:break-word; display:inline-block;}
  .doclink:hover{text-decoration:underline;}

  /* ---------- Media placeholder ---------- */
  .media-col{position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--head-h, 150px) + 16px);}
  .media-frame{
    border-radius:16px; border:1.5px dashed var(--line-strong);
    background:repeating-linear-gradient(135deg, var(--line) 0 10px, transparent 10px 20px);
    background-color:var(--paper-raised);
    aspect-ratio:4/3; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    gap:12px; padding:28px;
  }
  .media-frame .play{width:56px; height:56px; border-radius:50%; background:var(--paper); border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; font-size:20px; color:var(--pink-ink);}
  .media-frame .m-title{font-size:14px; font-weight:600; color:var(--ink);}
  .media-frame .m-note{font-size:12.5px; color:var(--slate); line-height:1.55; max-width:260px;}
  .media-caption{font-size:12px; color:var(--slate); margin-top:10px; line-height:1.55;}
  .media-frame.has-video{border:none; background:#000; aspect-ratio:auto; padding:0; display:block;}
  .media-frame.has-video video{width:100%; border-radius:16px; display:block; background:#000; max-height:420px;}
  .media-frame.has-video img{width:100%; border-radius:16px; display:block; background:#000; max-height:420px; object-fit:contain;}
</style>

<div class="sticky-head" id="stickyHead">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">VTEX</div>
        <div class="brand-text">
          <span class="eyebrow">VTEX + Office Depot &middot; Deep-Dive Session</span>
          <h1>Browse &amp; Search Playbook</h1>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="scoreband">
  <div class="scoreband-inner" id="scoreband"></div>
</div>

<div class="l1-wrap">
  <div class="l1" id="l1bar" role="tablist" aria-label="Requirements"></div>
</div>

<div class="l2-wrap">
  <div class="l2-head">
    <h2 id="l2label">Capabilities</h2>
  </div>
  <div class="l2" id="l2bar" role="tablist" aria-label="Capabilities"></div>
</div>

<main id="panelHost"></main>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;650;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<script>
(function(){
  var TOPICS = [
    { n:17, title:"Navigation & Category Management", flag:"native",
      doc:"https://help.vtex.com/en/docs/tutorials/intelligent-search-overview",
      caps:[
        ["Mega menu","native","Yes &mdash; mega menus are a native, no-code feature. Your merchandising team builds the category tree in VTEX Admin, and the storefront renders it as a multi-column mega menu automatically, with unlimited nesting depth. Columns, groupings, and promotional tiles inside the menu are managed the same way, so new departments or seasonal categories can go live without a developer ticket.",null,null,"https://help.vtex.com/en/docs/tutorials/intelligent-search-overview"],
        ["Subcategory links","native","Subcategory navigation is inherited automatically from your catalog hierarchy &mdash; there's no separate step to “wire up” a subcategory link. The moment a subcategory is created under a department in Catalog, it appears in navigation, in breadcrumbs, and as a filterable path in search, keeping your taxonomy and your navigation permanently in sync.",null,null,"https://help.vtex.com/en/docs/tutorials/intelligent-search-overview"],
        ["Cross-category links","native","A single SKU can be associated with more than one category in VTEX Catalog, so the same product can surface under, for example, both “Office Furniture” and “Ergonomic Chairs” without creating a duplicate product record. This keeps inventory, pricing, and reviews unified on one product while still letting merchandising cross-list it wherever shoppers expect to find it.",null,null,"https://developers.vtex.com/docs/guides/catalog-overview"],
        ["Breadcrumbs","native","Breadcrumb trails are generated automatically from the category hierarchy on every PLP and PDP &mdash; no manual configuration per page. Because they're driven by the same catalog tree that powers navigation and search, a breadcrumb is always accurate even after a product is recategorized. On top of the native trail, ODP's team also used the CMS's [ODP] Breadcrumb content block (shown in the clip alongside it) to add custom styling and a Hero banner above it, published through a normal content branch and merge &mdash; so marketing changes can be scheduled and reviewed before they go live.",null,"Office Depot workshop recording (short excerpt) &mdash; live storefront preview, then the [ODP] Breadcrumb &amp; Hero content panels in the CMS, ending on a scheduled branch merge into Main.","https://help.vtex.com/tutorial/site-editor-overview--299Dbeb9mFczUTyNQ9xPe1"],
        ["Product taxonomy","native","Your department, category, and custom-attribute structure is fully self-service in VTEX Admin's Catalog settings &mdash; no VTEX involvement needed to add a department, insert a subcategory, or introduce a new specification field (like “Color” or “Pack Type”). This taxonomy is what powers navigation, breadcrumbs, faceted search, and merchandising rules everywhere else in this playbook, so it's worth treating as the foundation your merchandising team owns directly.",null,null,"https://developers.vtex.com/docs/guides/catalog-overview"]
      ]
    },
    { n:18, title:"Faceted Search & Merchandising Control", flag:"native",
      doc:"https://help.vtex.com/en/docs/tutorials/search-configuration",
      caps:[
        ["Manage boost/bury","native","Merchandisers can push specific facet values up or down in Intelligent Search Admin with no engineering involved &mdash; for example, boosting an in-stock brand or burying a discontinued one for a given category. One thing worth setting expectations on for a catalog as broad as ODP's: facet configuration in IS is applied per attribute and category, not per individual search query, so boost/bury rules are best planned at the category level rather than as one-off exceptions for a single search term. For the highest-traffic queries, the Merchandising Rules engine (see Requirement #26) layers query-specific promotion and pricing on top of this.",null,null,"https://help.vtex.com/en/docs/tutorials/search-configuration"],
        ["Manage show/hide","native","Any indexed attribute can be turned into a visible or hidden facet, per category, from the same Search Admin screen &mdash; so a “Paper Weight” facet can show up under Paper & Printing but stay hidden under Furniture. This category scoping is the main lever for keeping facet panels relevant across a catalog that spans very different product types, and it's configured by your merchandising team without a deploy.",null,null,"https://help.vtex.com/en/docs/tutorials/search-configuration"],
        ["Rename facets","native","Facet labels are plain-text fields in Search Admin, so “Color” can become “Finish” for a furniture category or be translated for a different storefront locale, entirely through configuration. This lets merchandising match the terminology your customers actually use, without waiting on a content release.",null,null,"https://help.vtex.com/en/docs/tutorials/search-configuration"],
        ["Expand/collapse facets","native","Each facet can default to expanded or collapsed on the PLP, which is a config toggle rather than a frontend change &mdash; useful for keeping the filter panel scannable when a category has many facet groups (as ODP's office-supplies-to-furniture range does) while still surfacing the two or three filters that matter most by default.",null,null,"https://developers.vtex.com/docs/guides/faststore/components-index"],
        ["Support ranges for facets","native","Numeric attributes like price, wattage, or dimensions support range-bucketed facets (e.g. $0&ndash;25, $25&ndash;50) configured directly in Search Admin, with bucket boundaries you control rather than a fixed platform default. The clip alongside shows this on a live reference storefront's Price facet, bucketed automatically as results load.",null,"VTEX Deep Dive recording (short excerpt) &mdash; FastShop reference storefront, Category / Subcategory / Price / Mark facets panel.","https://help.vtex.com/en/docs/tutorials/search-configuration"],
        ["Support result counts for facets","native","Every facet value shown to a shopper carries a live result count (e.g. “Black (128)”) that updates as other filters are applied, so shoppers never filter into a dead end without warning. This comes from Intelligent Search's index and requires no custom counting logic.",null,null,"https://help.vtex.com/en/docs/tutorials/search-configuration"],
        ["Search-within-facets","custom","There's no native search-inside-a-facet-list control in VTEX today &mdash; it's a small storefront component (a text input that filters the facet's value list client-side or via the Search API) built on top of the standard facets response. This is a common ask for facets with long value lists (like Brand), and it's a low-effort custom build since the underlying facet data is already there; it doesn't require any change to how facets are configured in Admin.",null,null,"https://developers.vtex.com/docs/api-reference/intelligent-search-api"]
      ]
    },
    { n:19, title:"Omni-channel Fulfillment Visibility", flag:"native",
      doc:"https://developers.vtex.com/docs/guides/delivery-promise",
      caps:[
        ["Display shipping options on PLP/PDP","native","VTEX's Delivery Promise calculates shipping ETAs per SKU and shopper location and surfaces them directly on listing and product pages, so a shopper knows before adding to cart whether an item ships in 2 days or 2 weeks to their address. On the PDP, this is a real-time simulation against that exact SKU; on the PLP, VTEX uses a separate fulfillment-simulation call so availability can be shown for a full page of products at once without slowing the page down &mdash; on high-SKU-count PLPs, the practical pattern is to show a simple &ldquo;available for delivery&rdquo; badge on the listing page and the specific delivery date on the PDP once a shopper commits to a product.",null,"VTEX Deep Dive recording (short excerpt) &mdash; Hering PDP delivery panel, pickup-in-store and receive-at-home shown together with ETAs and prices.","https://developers.vtex.com/docs/guides/delivery-promise"],
        ["Display BOPIS options on PLP/PDP","native","Pickup-in-store eligibility and the nearest eligible pickup point are shown inline on PLP and PDP through Delivery Promise, calculated from real-time store inventory rather than a static flag. On a headless storefront, shoppers who explicitly pick a pickup point see every location within a 50&nbsp;km radius, while the default &ldquo;nearby pickup&rdquo; suggestion (no address entered yet) shows up to 40 points within 10&nbsp;km &mdash; a sensible default for most stores, and worth knowing about if ODP wants to tune how proactively pickup options are surfaced.",null,"VTEX Deep Dive recording (short excerpt) &mdash; Decathlon PDP, &ldquo;Pick up in store within 2 hours&rdquo; banner.","https://developers.vtex.com/docs/guides/delivery-promise-for-headless-stores"],
        ["Display SDD options on PLP/PDP","native","Same-day delivery eligibility is calculated per SKU and shopper location using the same Delivery Promise engine as standard shipping and BOPIS, so all three delivery types are evaluated together and shown consistently rather than as separate systems. Eligibility depends on your configured shipping policies and carrier SLAs for same-day service in a given zone.",null,null,"https://developers.vtex.com/docs/guides/delivery-promise"],
        ["Filter results by local store inventory","native","Shoppers can filter a listing page down to only the items in stock at their selected store or pickup point, using the Delivery Methods/Options facet shown in the clip. This reads live per-location inventory rather than a company-wide stock number, so a filtered result reflects what's actually on the shelf at that specific location.",null,"VTEX Deep Dive recording (short excerpt) &mdash; primegoods b2cdemostore, Electronics &amp; Appliances category, Delivery Methods/Options filters open.","https://developers.vtex.com/docs/guides/delivery-promise"],
        ["Show store-specific pricing & availability","native","Price tables and inventory can be scoped by store, region, or sales channel (trade policy), and the storefront automatically shows the shopper the price and stock that apply to their selected store &mdash; without them needing to re-search or manually switch context. This is the same mechanism that supports region- or channel-specific promotions and B2B contract pricing elsewhere in the platform.",null,null,"https://developers.vtex.com/docs/guides/delivery-promise"]
      ]
    },
    { n:20, title:"Product Listing Content & Merchandising", flag:"native",
      doc:"https://developers.vtex.com/docs/guides/faststore/components-index",
      caps:[
        ["Product name/ID display","native","Product name and SKU/reference ID render on every PLP card straight from Catalog data, with no per-page customization required. Because it's pulled live from Catalog rather than hardcoded in a template, a name or ID change in Admin reflects on the storefront as soon as the product reindexes.",null,null,"https://developers.vtex.com/docs/guides/faststore/components-index"],
        ["Multiple product images","native","Every SKU supports a full image gallery in Catalog, and FastStore automatically shows the primary image on the PLP card while making the rest of the gallery available on the PDP. Image order and the &ldquo;primary&rdquo; flag are both merchandising-controlled, not developer-controlled.",null,null,"https://developers.vtex.com/docs/guides/faststore/components-index"],
        ["Product ratings","native","Star ratings and review counts pull from your reviews provider (Bazaarvoice in ODP's case) and render on PLP cards automatically once the integration is connected &mdash; no custom rating widget to build or maintain.",null,null,"https://developers.vtex.com/docs/guides/faststore/components-index"],
        ["Multiple pricing types","native","Regular, sale, and member/contract pricing can render side by side on the same product card using Price Tables and trade policies, so a logged-in B2B buyer or loyalty member sees their negotiated price without a separate storefront. One nuance worth flagging: the price shown on a PLP card is calculated at the product level (its lowest active SKU price), so if a customer has applied a filter that narrows down to a specific, pricier variant, the PDP is the authoritative source for that variant's exact price &mdash; a pattern most multi-SKU catalogs already follow.",null,null,"https://developers.vtex.com/docs/guides/faststore/components-index"],
        ["Unit of measure display","native","Unit of measure &mdash; each, box, case, ream, pallet &mdash; is a native Catalog attribute and displays alongside price on both PLP and PDP without any custom development, which matters for an office-supplies catalog where the same SKU might be sold by the each or by the case.",null,null,"https://developers.vtex.com/docs/guides/catalog-overview"],
        ["Color/variant swatches","native","When a product is modeled as multiple SKUs under one parent (color, size, etc.), VTEX's native SKU Selector renders those variants as clickable swatches or a dropdown automatically. For catalogs migrated with a 1:1 product-to-SKU structure &mdash; which is how ODP's catalog is modeled today &mdash; the same swatch experience is achieved using VTEX's Similar Products relationships to group related items (for example, the same pen in Black, Blue, and Red), with the swatch grid driven by a variant-marking attribute from your PIM. Clicking a swatch navigates to that variant's own product page rather than swapping state in place, which is the one behavioral difference from the native multi-SKU pattern worth setting expectations on.",null,null,"https://developers.vtex.com/docs/guides/faststore/components-index"],
        ["Quick view","native","FastStore's native Quick View component opens key product details &mdash; images, price, variant selection, add to cart &mdash; in a modal directly from the PLP, so shoppers can evaluate and buy without a full page navigation. It's a drop-in component, not a custom build.",null,null,"https://developers.vtex.com/docs/guides/faststore/components-index"],
        ["Social proof indicators","custom","Micro-copy like &ldquo;only 3 left&rdquo; or &ldquo;5-star favorite&rdquo; isn't a built-in PLP element in VTEX, but it's a light storefront component to build: inventory quantity and rating data are both already available from Catalog and your reviews provider, so the component is mostly presentation logic (thresholds for when to show “low stock,” which rating bucket counts as a “favorite”) rather than new data plumbing.",null,null,"https://developers.vtex.com/docs/guides/faststore/components-index"]
      ]
    },
    { n:21, title:"Shopping Lists & Specialty Finders", flag:"custom",
      doc:"https://developers.vtex.com/docs/guides/catalog-overview",
      docNote:"No single walkthrough for this one &mdash; start from the Catalog & Search API guides.",
      caps:[
        ["Create shopping lists","custom","VTEX doesn't ship a native “saved list” object, so this is built as a storefront feature on top of VTEX MasterData: a shopper names a list, and it's stored as a record tied to their account, separate from their active cart. Because it's a custom data entity rather than a workaround on the cart itself, a shopper can hold several named lists at once (e.g. “Break Room Supplies,” “Q4 Restock”) without them interfering with each other.",null,null,"https://developers.vtex.com/docs/guides/catalog-overview"],
        ["Edit shopping lists","custom","Adding or removing items from a saved list uses the same custom list-management UI and MasterData record as list creation, so edits are immediate and don't require rebuilding the list from scratch.",null,null,"https://developers.vtex.com/docs/guides/catalog-overview"],
        ["Delete shopping lists","custom","Lists are deleted from the same custom list-management screen; since the list itself is a custom MasterData record rather than a native VTEX object, deleting it is a straightforward record removal with no impact on the shopper's order history or account.",null,null,"https://developers.vtex.com/docs/guides/catalog-overview"],
        ["Add list to cart","custom","A single &ldquo;Add all to cart&rdquo; action reads every item on a saved list and pushes it into the active cart in one call to VTEX's Checkout API, checking current price and availability for each item at that moment &mdash; so a list saved weeks ago always reflects today's stock and pricing rather than stale data.",null,null,"https://developers.vtex.com/docs/api-reference/checkout-api"],
        ["Back-to-School Supply List","custom","This is a curated, pre-built list &mdash; mapped to a grade level or curriculum &mdash; delivered as a guided-buying experience on top of the same custom list infrastructure, so a parent or teacher can add an entire pre-assembled supply list to cart in one action instead of searching for two dozen items individually. The curation itself (which SKUs belong to which grade) is a merchandising/content exercise, not a platform limitation.",null,null,"https://developers.vtex.com/docs/guides/catalog-overview"],
        ["Ink & Toner Finder","custom","A printer-to-cartridge lookup tool, built as a custom finder against the Catalog API: a shopper selects (or searches for) their printer model, and the finder returns the compatible cartridges as a filtered product list. The compatibility mapping itself lives in product specifications or a MasterData lookup table that your team maintains as the printer catalog changes.",null,null,"https://developers.vtex.com/docs/api-reference/catalog-api"],
        ["Expansion of list concepts across variants","custom","Because lists are built as their own MasterData-backed feature rather than a one-off hack, the same infrastructure extends cleanly to adjacent use cases &mdash; gift registries, favorites/wishlists, or reorder lists &mdash; typically by adding a “type” field to the list record rather than building a new system for each one.",null,null,"https://developers.vtex.com/docs/guides/catalog-overview"]
      ]
    },
    { n:22, title:"Retail Media & Ad Placements", flag:"native",
      doc:"https://www.vtex.com/en-us/products/ads_platform/",
      caps:[
        ["Sponsored carousels","native","VTEX Ads is VTEX's native retail media platform: brands or sellers bid on sponsored product carousels placed on the PLP, home page, or search results, and every campaign is managed through the Ads console &mdash; targeting, budget, bidding, and reporting included. This turns ad placements into a monetizable, self-serve inventory for ODP rather than a manually-sold, manually-trafficked media package.",null,null,"https://help.vtex.com/en/docs/tracks/vtex-ads-first-steps"],
        ["In-grid Product Listing Ads (PLAs)","native","Sponsored products can blend directly into the organic search or category grid, clearly labeled “Sponsored,” with placement rules and frequency configured in VTEX Ads &mdash; the same auction and targeting engine as carousels, just a different surface.",null,null,"https://help.vtex.com/en/docs/tracks/vtex-ads-first-steps"],
        ["In-grid ads","native","Display ad units (banner-style creative, not just sponsored products) can be placed directly inside the product grid at configured intervals via Ads placements, giving ODP a second native ad format alongside PLAs without separate ad-serving infrastructure.",null,null,"https://developers.vtex.com/docs/guides/vtex-ads"],
        ["Banner placements","native","Campaign banners across the storefront are scheduled, targeted, and reported on through the Ads Platform's placement manager, so a single console covers both onsite banner inventory and product-level sponsored placements.",null,null,"https://developers.vtex.com/docs/guides/vtex-ads"]

    { n:23, title:"High-Performance, Scalable Search Engine", flag:"native",
      doc:"https://help.vtex.com/en/docs/tutorials/intelligent-search-overview",
      caps:[
        ["Sub-200ms response time","native","Intelligent Search runs on VTEX's own elastic, multi-tenant infrastructure and returns results in sub-200ms at steady state, with no query tuning or infrastructure sizing required from ODP's team &mdash; this is a platform SLA, not a configuration you manage.",null,null,"https://help.vtex.com/en/docs/tutorials/intelligent-search-overview"],
        ["High peak traffic capacity","native","The same infrastructure autoscales automatically for peak commerce events &mdash; Black Friday, back-to-school, a flash promotion &mdash; without ODP needing to forecast traffic or provision capacity ahead of time, since search scales as part of the shared VTEX platform rather than a dedicated instance ODP owns and sizes.",null,null,"https://help.vtex.com/en/docs/tutorials/intelligent-search-overview"],
        ["Up-to-date search results","native","Catalog changes (price, stock, content, new products) trigger automatic reindexing with no manual step, and results are typically reflected on the storefront within tens of minutes of the change &mdash; in practice, expect roughly 20&ndash;40 minutes for a product page and a bit longer for search/listing pages to fully reflect a change, which is worth knowing when planning a time-sensitive price change or launch. One specific case worth flagging for ODP's promotions team: creating or editing a promotion does not, by itself, trigger reindexing of the affected products, so a freshly-launched promotion may not show its badge in search results until those products are reindexed &mdash; triggering a reindex via the Import Products API closes that gap immediately rather than waiting for the next scheduled catalog update.",null,null,"https://help.vtex.com/en/docs/tutorials/intelligent-search-overview"]
      ]
    },
    { n:24, title:"Sorting, Pagination & Display Options", flag:"native",
      doc:"https://help.vtex.com/en/docs/tutorials/search-configuration",
      caps:[
        ["Native sorting","native","Best sellers, price (low-high/high-low), release date, and relevance sorts are all built in and available from a dropdown on every PLP out of the box &mdash; no development needed to offer any of these standard sort orders.",null,null,"https://help.vtex.com/en/docs/tutorials/search-configuration"],
        ["Custom sorting","native","Beyond the standard options, additional sort orders (e.g. by a custom Catalog Score, by margin, or by a promotional priority) can be defined through Search Admin's ranking rules, giving merchandising a way to influence order without touching code.",null,null,"https://help.vtex.com/tracks/vtex-intelligent-search--19wrbB7nEQcmwzDPl1l4Cb/1qlObWIib6KqgrfX1FCOXS"],
        ["Smart AI-driven sort","native","The default relevance sort blends textual match quality with behavioral and conversion signals (what shoppers actually click and buy for a given query) automatically, continuously improving without manual tuning &mdash; though for logged-in B2B buyers using organization-scoped catalogs, note that collection-based ordering can take precedence over relevance for that session; Catalog Score plus a Relevance Rule is the standard way to keep desired products prioritized in that scenario.",null,null,"https://help.vtex.com/tracks/vtex-intelligent-search--19wrbB7nEQcmwzDPl1l4Cb/1qlObWIib6KqgrfX1FCOXS"],
        ["Pagination with crawlable links","native","Paginated PLPs generate crawlable, indexable URLs out of the box (not hash-based or JavaScript-only pagination), so search engines can index every page of a long category listing without any extra SEO work.",null,null,"https://developers.vtex.com/docs/guides/faststore/components-index"],
        ["Grid/list toggle view","native","Shoppers can switch between a grid and a list display on the PLP using a native FastStore component &mdash; a common ask for catalogs like ODP's where some shoppers (particularly B2B buyers comparing specs) prefer a denser list view.",null,null,"https://developers.vtex.com/docs/guides/faststore/components-index"],
        ["Result counts display","native","The total number of matching products shows above the grid and updates live as filters or facets are applied, so shoppers always know how many results a given combination of filters returns before they scroll.",null,null,"https://help.vtex.com/en/docs/tutorials/search-configuration"]
      ]
    },
    { n:25, title:"Advanced Search Quality & NLP", flag:"native",
      doc:"https://help.vtex.com/docs/tutorials/intelligent-search-semantic-search-beta",
      caps:[
        ["Natural language processing (NLP)","native","VTEX's Semantic Search (part of Intelligent Search) parses shopper queries for intent and meaning rather than only literal keyword overlap, so a query like &ldquo;something to write on a whiteboard&rdquo; can surface dry-erase markers even without an exact keyword match. It's currently a beta capability at strongest performance for English-language catalogs like ODP's; VTEX continues to expand language coverage, which is worth a quick confirmation with your VTEX team at implementation time.",null,null,"https://help.vtex.com/en/docs/tutorials/intelligent-search-semantic-search-beta"],
        ["Long-tail query support","native","Semantic Search resolves long, conversational, multi-word queries by understanding the relationships between the terms rather than requiring an exact phrase match, which particularly helps B2B buyers searching in natural language (e.g. &ldquo;ergonomic chair for standing desk setup&rdquo;) rather than product-catalog terminology.",null,null,"https://help.vtex.com/en/docs/tutorials/intelligent-search-semantic-search-beta"],
        ["Short-tail query support","native","Broad one- or two-word queries are matched against catalog attributes, category structure, and popularity/conversion signals so the most relevant, most-purchased results surface first, rather than an alphabetical or arbitrary ordering of every loosely-matching product.",null,null,"https://help.vtex.com/en/docs/tutorials/intelligent-search-overview"],
        ["Partial SKU search","native","Typing part of a SKU, reference ID, or EAN resolves to the right product through Intelligent Search's identifier indexing. One detail worth knowing for internal or B2B ordering workflows: partial-ID matching works from the beginning of the identifier (a prefix, like the first several digits) rather than matching a fragment from the middle of the code &mdash; the same behavior as most catalog search engines, and one that's easy to communicate to buyers who search by internal SKU prefixes.",null,null,"https://developers.vtex.com/docs/guides/vtex-intelligent-search"],
        ["Full SKU search","native","An exact SKU, reference ID, or EAN lookup returns the matching product directly, which is especially useful for B2B buyers and CSRs working from a purchase order or a printed catalog reference number rather than browsing.",null,null,"https://developers.vtex.com/docs/guides/vtex-intelligent-search"],
        ["Special characters handling","native","Search normalizes accents, hyphens, ampersands, and similar special characters, so a query typed without an accent (or with a hyphen where the catalog uses a space) still matches the intended product &mdash; shoppers aren't required to type a product name exactly as it appears in the catalog.",null,null,"https://help.vtex.com/en/docs/tutorials/intelligent-search-overview"],
        ["Search autocomplete","native","As a shopper types, Intelligent Search suggests matching search terms, products, and categories in real time, out of the box &mdash; the clip alongside shows this live on a reference storefront, suggesting relevant products as soon as a few characters are entered. Suggestions are driven by the same catalog and popularity data as full search results, so they stay accurate as the catalog changes.",null,"VTEX Deep Dive recording (short excerpt) &mdash; Decathlon reference site, &ldquo;jaqueta -10&rdquo; typeahead/autocomplete.","https://help.vtex.com/en/docs/tutorials/intelligent-search-overview"],
        ["Trending search terms","native","Search Insights (VTEX's native search analytics dashboard) surfaces the terms shoppers are searching for most, including terms that are trending up, so merchandising can react quickly &mdash; setting up a redirect or featuring inventory for a term that's suddenly spiking, for example.",null,null,"https://help.vtex.com/subcategory/insights-overview--1TIJqw8kV2Yok4iQe4SAkq"],
        ["‘Did You Mean’ suggestions","native","When a query returns weak or no strong matches (commonly due to a likely typo), Search can suggest the probable intended term instead of leaving the shopper on a poor result set, reducing the number of searches that end in frustration or site abandonment.",null,null,"https://help.vtex.com/en/docs/tutorials/intelligent-search-overview"],
        ["Zero-results handling","native","Zero-results fallback behavior is fully configurable in Search Admin: a query can redirect to a category page, broaden automatically to relax an overly specific filter, or surface suggested categories and popular products instead of a dead-end “no results” page. The clip alongside shows the reference &ldquo;No products found&rdquo; state from the ODP workshop, immediately following a Custom Product Shelf and Recommendation Shelf setup &mdash; both good complements to native zero-results handling, since a recommendation shelf gives the shopper a next step even when their exact query comes up empty.",null,"Office Depot workshop recording (short excerpt) &mdash; Custom Product Shelf &amp; Recommendation Shelf setup, ending on the Al's &ldquo;No products found&rdquo; zero-results reference.","https://help.vtex.com/en/docs/tutorials/synonyms"]
      ]
    },
    { n:26, title:"Search Merchandising & Management Tools", flag:"native",
      doc:"https://help.vtex.com/en/docs/tutorials/synonyms",
      caps:[
        ["Manual synonym management","native","Synonyms &mdash; mapping &ldquo;binder&rdquo; to &ldquo;folder,&rdquo; or a brand's model number to its common name &mdash; are added and edited directly in Intelligent Search Admin by your merchandising team, no engineering ticket required. For a catalog migrating from another search platform, existing synonym lists typically need to be re-entered here as part of go-live, which is worth budgeting time for during migration.",null,null,"https://help.vtex.com/en/docs/tutorials/synonyms"],
        ["AI synonym management","native","Intelligent Synonyms analyzes real shopper search behavior and suggests related-term synonyms automatically (for example, noticing that shoppers who search &ldquo;planner&rdquo; often mean &ldquo;agenda&rdquo;), which merchandisers review and approve rather than needing to discover every synonym opportunity manually.",null,null,"https://help.vtex.com/en/docs/tutorials/synonyms"],
        ["Search redirects","native","Specific queries can be redirected straight to a landing page, category, or campaign page, configured in Search Admin &mdash; useful for seasonal campaigns (redirecting &ldquo;back to school&rdquo; to a curated landing page) or for steering a known ambiguous query to the intended destination.",null,null,"https://help.vtex.com/en/docs/tutorials/search-configuration"],
        ["Searchable field control","native","Which product attributes are indexed and searchable (versus indexed only as a filter, or not indexed at all) is configurable per catalog in Search Admin, letting your team decide, for example, that a supplier SKU code should be searchable but an internal warehouse code should not.",null,null,"https://help.vtex.com/en/docs/tutorials/search-configuration"],
        ["Pre-filter rules","native","Pre-filter rules can force-include or force-exclude specific products from a given query before relevance ranking even runs &mdash; for example, always excluding discontinued or non-sellable items from a category's results regardless of how well they'd otherwise match.",null,null,"https://help.vtex.com/tracks/vtex-intelligent-search--19wrbB7nEQcmwzDPl1l4Cb/2FpbarYzsnbg7aZZn3TGF8"],
        ["Pre-rank rules","native","Merchandising rules can pin or prioritize specific SKUs for a given query ahead of standard relevance scoring &mdash; the clip alongside shows this built live by an AI agent from a plain-language prompt (&ldquo;promote Moleskine when customers search notebook&rdquo;), which is the same rule type your merchandisers would otherwise configure directly in Search Admin's Visual Editor. One nuance for B2B storefronts specifically: for logged-in B2B buyers, VTEX's B2B Suite scopes results to the buyer's assigned product collections, and that collection ordering takes precedence over merchandising rules in that authenticated session. The standard way to still prioritize or demote specific products for logged-in buyers is a Catalog Score combined with a Relevance Rule, which continues to apply on top of collection scoping &mdash; worth a short working session with your VTEX team if ODP's B2B and B2C merchandising strategies need to line up exactly.",null,"VTEX Deep Dive recording (short excerpt) &mdash; AI Workspace agent builds a live merchandising rule from a natural-language prompt (promote Moleskine notebooks), exploring the underlying merchandising-rule code as it works.","https://help.vtex.com/en/docs/tutorials/creating-merchandising-rules-visual-editor"],
        ["Rule scheduling","native","Merchandising rules can be scheduled with a start and end date/time so they activate and expire automatically around a campaign window, without anyone needing to remember to turn a promotion-driven rule off manually.",null,null,"https://help.vtex.com/en/docs/tutorials/merchandising-rules-list"],
        ["Ranking diagnostics","native","Search Admin includes a diagnostics view showing why a specific product ranked where it did for a given query &mdash; which rules, boosts, or relevance signals contributed &mdash; which turns a merchandiser's “why is this product not showing up higher” question into a self-service answer instead of an escalation.",null,null,"https://help.vtex.com/tracks/vtex-intelligent-search--19wrbB7nEQcmwzDPl1l4Cb/1qlObWIib6KqgrfX1FCOXS"],
        ["Environment cloning","native","Search configuration &mdash; synonyms, redirects, merchandising rules, facet settings &mdash; can be cloned between environments (for example, from a staging/sandbox account to production), so ODP's search team can test a significant merchandising change safely before it reaches live shoppers.",null,null,"https://help.vtex.com/en/docs/tutorials/search-configuration"]
      ]
    },
    { n:27, title:"Search Analytics & Reporting", flag:"native",

      caps:[
        ["Search performance analytics","native","Search Insights dashboards, available natively in VTEX Admin, report top searches, conversion rate by query, and zero-result terms out of the box &mdash; giving your team a ready-made view of what shoppers are searching for, what's converting, and where search is failing them, without needing to instrument a separate analytics tool for search specifically.",null,null,"https://help.vtex.com/subcategory/insights-overview--1TIJqw8kV2Yok4iQe4SAkq"]

    { n:28, title:"Content Search & Visual/Voice Search", flag:"native",
      doc:"https://www.vtex.com/en-us/products/cx_platform/",
      caps:[
        ["Content page search","native","CMS pages built in VTEX's content platform (landing pages, guides, category stories) are indexed and searchable alongside products through the same search engine, so a shopper searching a topic rather than a product name can still land on the right page &mdash; no separate content search system to stand up and keep in sync.",null,null,"https://help.vtex.com/en/docs/tutorials/vtex-cx-platform-overview"],
        ["Help page search","native","Help center and FAQ content is indexed the same way as other CMS content, so support articles surface in the same unified search experience &mdash; a shopper looking for a return policy doesn't need a separate help-search box to find it.",null,null,"https://help.vtex.com/en/docs/tutorials/vtex-cx-platform-overview"],
        ["Image search","native","VTEX's Agentic CX Platform can match a shopper-provided image against your catalog using visual similarity, letting a shopper who has a photo of an item find comparable products without knowing what to type. This is part of VTEX's newer AI-driven CX capabilities, so scope and rollout should be confirmed with your VTEX team against ODP's target timeline.",null,null,"https://www.vtex.com/en-us/products/cx_platform"],
        ["Voice search","native","The same CX Platform accepts spoken queries and resolves them against catalog data using the same relevance engine as typed search, so voice input becomes another entry point into the same search experience rather than a parallel system to maintain. As with image search, this sits within VTEX's newer AI/CX roadmap and is worth confirming timing on with your VTEX team.",null,null,"https://www.vtex.com/en-us/products/cx_platform"]

    { n:29, title:"Store Locator", flag:"native",

      caps:[
        ["Store locator","native","VTEX's native Store Locator app renders a map and list view of nearby stores, integrated with Delivery Promise so distance, business hours, and delivery/pickup eligibility all come from the same underlying pickup-point data &mdash; no separate store database to maintain. Location search on headless storefronts has a maximum radius of 50&nbsp;km, which comfortably covers a dense store footprint like ODP's.",null,null,"https://developers.vtex.com/docs/guides/vtex-store-locator"],
        ["Store finder for BOPIS","native","The same locator can filter results down to only the stores that currently have stock to support pickup for the items in the shopper's cart, using real-time per-location inventory rather than a static “this store offers pickup” flag &mdash; so a shopper is never sent to a store that can't actually fulfill their order.",null,null,"https://developers.vtex.com/docs/guides/vtex-store-locator"],
        ["Print & copy services locator","custom","VTEX doesn't have a native concept of a bookable in-store service, so surfacing which stores offer print or copy services is a storefront customization: service availability per store is modeled as data (either a store attribute or a service SKU in Catalog) and the Store Locator UI is extended to filter and display it. It's a modest build precisely because it reuses Store Locator's existing map and filtering UI rather than replacing it.",null,null,"https://developers.vtex.com/docs/guides/vtex-store-locator"]

  var CLIP_BASE = 'assets/clips/';

  // Custom builds Office Depot already has live today, keyed by "requirement|capability".
  var BUILT = {
    "18|Search-within-facets": true,
    "21|Create shopping lists": true,
    "21|Edit shopping lists": true,
    "21|Delete shopping lists": true,
    "21|Add list to cart": true
  };

  function isBuilt(topicNumber, capTitle){ return BUILT[topicNumber + '|' + capTitle] === true; }

  function clipFor(topicNumber, capTitle){
    var file = CLIPS[topicNumber + '|' + capTitle];
    return file ? CLIP_BASE + file : null;
  }

  var scoreband = document.getElementById('scoreband');
  var l1bar = document.getElementById('l1bar');
  var l2bar = document.getElementById('l2bar');
  var l2label = document.getElementById('l2label');
  var panelHost = document.getElementById('panelHost');

  var state = { topic: TOPICS[0].n, cap: TOPICS[0].caps[0][0] };
  try {
    var sT = sessionStorage.getItem('bsp-topic');
    var sC = sessionStorage.getItem('bsp-cap');
    if (sT && TOPICS.some(function(t){ return String(t.n) === sT; })) state.topic = Number(sT);
    if (sC) state.cap = sC;
  } catch(e){}

  function getTopic(n){ return TOPICS.filter(function(t){ return t.n === n; })[0]; }

  function customCount(t){
    return t.caps.filter(function(c){ return c[1] === 'custom'; }).length;
  }

  // "Native" when nothing needs a build, "Mostly native" when only part of the
  // requirement does, "Custom build" when the whole requirement is custom.
  function topicFlag(t){
    var custom = customCount(t);
    if (custom === 0) return { cls:'native', label:'Native' };
    if (custom === t.caps.length) return { cls:'custom', label:'Custom build' };
    return { cls:'mostly', label:'Mostly native' };
  }

  function renderScoreband(){
    var total = 0, custom = 0;
    TOPICS.forEach(function(t){ total += t.caps.length; custom += customCount(t); });
    var native = total - custom;
    function pct(n){ return total ? Math.round(n / total * 100) + '%' : '0%'; }

    var stats = [
      { cls:'', figure:total, label:'Capabilities scored', sub:'across ' + TOPICS.length + ' requirements' },
      { cls:'is-native', figure:native, label:'Native', sub:'no customization &mdash; ' + pct(native) },
      { cls:'is-custom', figure:custom, label:'Customization', sub:'buildable on VTEX APIs &mdash; ' + pct(custom) },
      { cls:'is-none', figure:0, label:'Not supported', sub:'on VTEX &mdash; 0%' }
    ];

    scoreband.innerHTML = stats.map(function(s){
      return '<div class="stat '+s.cls+'">' +
        '<div class="figure">'+s.figure+'</div>' +
        '<div class="label">'+s.label+'</div>' +
        '<div class="sub">'+s.sub+'</div>' +
      '</div>';
    }).join('');
  }

  function renderL1(){
    l1bar.innerHTML = '';
    TOPICS.forEach(function(t){
      var btn = document.createElement('button');
      btn.className = 'l1-btn';
      btn.setAttribute('aria-pressed', t.n === state.topic ? 'true' : 'false');
      var flag = topicFlag(t);
      btn.innerHTML =
        '<span class="n">#'+t.n+'</span>' +
        '<span class="t">'+t.title+'</span>' +
        '<span class="flag '+flag.cls+'">'+flag.label+'</span>';
      btn.addEventListener('click', function(){
        state.topic = t.n;
        state.cap = t.caps[0][0];
        persist();
        renderL1(); renderL2(); renderPanel();
      });
      l1bar.appendChild(btn);
    });
  }

  function renderL2(){
    var t = getTopic(state.topic);
    l2label.textContent = 'Requirement #'+t.n+' · '+t.title+' · '+t.caps.length+' capabilities';
    l2bar.innerHTML = '';
    t.caps.forEach(function(c){
      var btn = document.createElement('button');
      var built = isBuilt(t.n, c[0]);
      btn.className = 'l2-btn';
      btn.setAttribute('aria-pressed', c[0] === state.cap ? 'true' : 'false');
      if (built) btn.title = 'Custom build — already live at Office Depot';
      btn.innerHTML = '<span class="dot '+(built ? 'built' : c[1])+'"></span><span>'+c[0]+'</span>';
      btn.addEventListener('click', function(){
        state.cap = c[0];
        persist();
        renderL2(); renderPanel();
      });
      l2bar.appendChild(btn);
    });
  }

  function renderPanel(){
    var t = getTopic(state.topic);
    var cap = t.caps.filter(function(c){ return c[0] === state.cap; })[0];
    if (!cap) return;
    var flag = cap[1], desc = cap[2], videoCaption = cap[4], capDoc = cap[5];
    var built = isBuilt(t.n, cap[0]);
    var badgeClass = built ? 'built' : flag;
    var badgeLabel = built
      ? 'Custom build &mdash; already live at ODP'
      : (flag === 'native' ? 'Native &mdash; no custom dev' : 'Custom build on VTEX APIs');
    var mediaUrl = cap[3] || clipFor(t.n, cap[0]);
    var docHref = capDoc || t.doc;
    var docLabel = capDoc ? "VTEX documentation for “"+cap[0]+"”" : (t.docNote ? t.docNote : "VTEX documentation for this requirement");

    var mediaHtml = mediaUrl
      ? (
          '<div class="media-frame has-video">' +
            (/\.gif$/i.test(mediaUrl)
              ? '<img src="'+mediaUrl+'" alt="'+cap[0]+' clip" loading="lazy">'
              : '<video controls preload="metadata" playsinline src="'+mediaUrl+'"></video>') +
          '</div>' +
          (videoCaption ? '<p class="media-caption">'+videoCaption+'</p>' : '')
        )
      : (
          '<div class="media-frame">' +
            '<div class="play">&#9654;</div>' +
            '<div class="m-title">Video or screenshot walkthrough</div>' +
            '<div class="m-note">Drop in a Loom/YouTube embed, GIF, or annotated screenshot demoing &ldquo;'+cap[0]+'&rdquo; for the ODP workshop.</div>' +
          '</div>' +
          '<p class="media-caption">Placeholder &mdash; swap for the real asset before the session.</p>'
        );

    panelHost.innerHTML =
      '<div class="panel-head">' +
        '<div>' +
          '<div class="id mono">Requirement #'+t.n+' &middot; '+t.title+'</div>' +
          '<h2>'+cap[0]+'</h2>' +
        '</div>' +
        '<span class="badge '+badgeClass+'">'+badgeLabel+'</span>' +
      '</div>' +
      '<div class="content-grid">' +
        '<div class="text-col">' +
          '<div class="block">' +
            '<h3>How to do it in VTEX</h3>' +
            '<div class="solution"><p>'+desc+'</p></div>' +
          '</div>' +
          '<div class="block">' +
            '<h3>Documentation</h3>' +
            '<a class="doclink" href="'+docHref+'" target="_blank" rel="noopener">'+docLabel+'</a>' +
          '</div>' +
        '</div>' +
        '<div class="media-col">' +
          mediaHtml +
        '</div>' +
      '</div>';
  }

  function persist(){
    try {
      sessionStorage.setItem('bsp-topic', String(state.topic));
      sessionStorage.setItem('bsp-cap', state.cap);
    } catch(e){}
  }

  if (!getTopic(state.topic).caps.some(function(c){ return c[0] === state.cap; })){
    state.cap = getTopic(state.topic).caps[0][0];
  }

  renderScoreband();
  renderL1();
  renderL2();
  renderPanel();

  var stickyHead = document.getElementById('stickyHead');
  function syncHeadHeight(){
    if (!stickyHead) return;
    document.documentElement.style.setProperty('--head-h', stickyHead.offsetHeight + 'px');
  }
  syncHeadHeight();
  window.addEventListener('resize', syncHeadHeight);
  if (window.ResizeObserver){
    new ResizeObserver(syncHeadHeight).observe(stickyHead);
  }
})();
</script>

</body></html>
